<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Habit Tracker</title>
    
    <!-- PWA Magic Tags for iOS and Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HabitMagic">
    <link rel="apple-touch-icon" href="https://flaticon.com">
    
    <!-- Manifest Link for Android Home Screen Setup -->
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk1hZ2ljIEhhYml0IFRyYWNrZXIiLAogICJzaG9ydF9uYW1lIjogIkhhYml0TWFnaWMiLAogICJzdGFydF91cmwiOiAiLiIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiI2YwZjJmNSIsCiAgInRoZW1lX2NvbG9yIjogIiM2YzVjZTciLAogICJpY29ucyI6IFsKICAgIHsKICAgICAgInNyYyI6ICJodHRwczovL2Nkbi1pY29ucy1wbmcuZmxhdGljb24uY29tLzUxMi8zNDcyLzM0NzI3MTkucG5nIiwKICAgICAgInNpemVzIjogIjUxMng1MTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmciCiAgICB9CiAgXQp9">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            margin-top: 40px;
        }
        h1 {
            color: #6c5ce7;
            text-align: center;
            margin-top: 0;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #6c5ce7;
        }
        button {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .habit-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .habit-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            margin-bottom: 10px;
            border-radius: 12px;
            border-left: 5px solid #6c5ce7;
            transition: all 0.3s ease;
        }
        .habit-item.done {
            border-left-color: #00b894;
            background: #e3faf3;
            text-decoration: line-through;
            color: #b2bec3;
        }
        .habit-text {
            font-size: 16px;
            font-weight: 500;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        .btn-check { background: #00b894; padding: 6px 12px; font-size: 14px; color: white; border: none; border-radius: 5px;}
        .btn-delete { background: #ff7675; padding: 6px 12px; font-size: 14px; color: white; border: none; border-radius: 5px;}
    </style>
</head>
<body>

    <div class="app-container">
        <h1>✨ HabitMagic</h1>
        
        <div class="input-group">
            <input type="text" id="habitInput" placeholder="Add a new daily habit...">
            <button onclick="addHabit()">Add</button>
        </div>

        <ul class="habit-list" id="habitList"></ul>
    </div>

    <script>
        // Load saved habits when app opens
        let habits = JSON.parse(localStorage.getItem('myHabits')) || [];

        function saveAndRender() {
            localStorage.setItem('myHabits', JSON.stringify(habits));
            const list = document.getElementById('habitList');
            list.innerHTML = '';
            
            habits.forEach((habit, index) => {
                const li = document.createElement('li');
                li.className = `habit-item ${habit.done ? 'done' : ''}`;
                
                li.innerHTML = `
                    <span class="habit-text">${habit.text}</span>
                    <div class="actions">
                        <button class="btn-check" onclick="toggleHabit(${index})">✓</button>
                        <button class="btn-delete" onclick="deleteHabit(${index})">X</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function addHabit() {
            const input = document.getElementById('habitInput');
            if (input.value.trim() === '') return;
            
            habits.push({ text: input.value, done: false });
            input.value = '';
            saveAndRender();
        }

        function toggleHabit(index) {
            habits[index].done = !habits[index].done;
            saveAndRender();
        }

        function deleteHabit(index) {
            habits.splice(index, 1);
            saveAndRender();
        }

        // Start the app!
        saveAndRender();

        // Simple Service Worker trick to make it a real PWA on mobile phones
        if ('serviceWorker' in navigator) {
            const swCode = "self.addEventListener('fetch', function(e){});";
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log(err));
        }
    </script>
</body>
</html>
